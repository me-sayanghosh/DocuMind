services:
  - type: web
    name: docchat-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: docchat-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docchat-redis
          property: connectionString

  - type: worker
    name: docchat-worker
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && arq app.worker.settings.WorkerSettings
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docchat-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docchat-redis
          property: connectionString

databases:
  - name: docchat-pg
    plan: starter
    postgresMajorVersion: 16
