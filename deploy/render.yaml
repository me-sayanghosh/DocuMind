services:
  - type: web
    name: docchat-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: docchat-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docchat-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1

  - type: worker
    name: docchat-worker
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && arq app.worker.settings.WorkerSettings
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docchat-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docchat-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1

  - type: redis
    name: docchat-redis
    plan: starter
    maxmemoryPolicy: noeviction

databases:
  - name: docchat-pg
    plan: starter
    postgresMajorVersion: 16
