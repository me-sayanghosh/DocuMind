[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docchat"
version = "0.1.0"
description = "Multi-tenant PDF RAG with hybrid retrieval, verifiable citations, and eval harness"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "arq>=0.25.0",
    "redis>=5.0.3",
    "pymupdf>=1.24.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.5",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "anthropic>=0.20.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.5.1",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.2",
    "mypy>=1.9.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "B008", "E402", "E712"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
