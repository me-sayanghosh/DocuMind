version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docchat-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: docchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docchat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docchat-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/docchat
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-claude-3-5-sonnet-20241022}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-claude-3-5-haiku-20241022}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-hash}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      EMBED_DIM: ${EMBED_DIM:-384}
      JWT_SECRET: ${JWT_SECRET:-insecure-dev-jwt-secret-please-change-to-32-bytes-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      STORAGE_BACKEND: local
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docchat-worker
    command: arq app.worker.settings.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/docchat
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-hash}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      EMBED_DIM: ${EMBED_DIM:-384}
      STORAGE_BACKEND: local
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docchat-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
